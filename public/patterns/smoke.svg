<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="none">
<defs>
  <radialGradient id="mist"><stop stop-color="#D8DDCE" stop-opacity=".9"/><stop offset=".45" stop-color="#9EADA0" stop-opacity=".5"/><stop offset="1" stop-color="#77867C" stop-opacity="0"/></radialGradient>
  <radialGradient id="light"><stop stop-color="#F4E7C3" stop-opacity=".7"/><stop offset=".5" stop-color="#B6C2AF" stop-opacity=".3"/><stop offset="1" stop-color="#9EADA0" stop-opacity="0"/></radialGradient>
  <filter id="billow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".008 .013" numOctaves="3" seed="12" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="120" xChannelSelector="R" yChannelSelector="G"/>
    <feGaussianBlur stdDeviation="5"/>
  </filter>
</defs>
<g filter="url(#billow)">
  <ellipse cx="80" cy="610" rx="480" ry="310" fill="url(#mist)"/>
  <ellipse cx="460" cy="460" rx="460" ry="390" fill="url(#mist)"/>
  <ellipse cx="900" cy="230" rx="470" ry="340" fill="url(#mist)"/>
  <ellipse cx="1130" cy="740" rx="520" ry="420" fill="url(#mist)"/>
  <ellipse cx="180" cy="790" rx="520" ry="160" fill="url(#light)" transform="rotate(-23 180 790)"/>
  <ellipse cx="690" cy="470" rx="630" ry="120" fill="url(#light)" transform="rotate(-28 690 470)"/>
  <ellipse cx="1030" cy="100" rx="520" ry="170" fill="url(#light)" transform="rotate(-18 1030 100)"/>
</g>
</svg>
